{% extends 'base.html' %}
{% load static %}

{% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}

{% block title %}Малка пауза | iBands{% endblock %}

{% block content %}
    <section class="error-screen">
        <div class="error-layout">
            <div class="error-copy">
                <h1>Малка пауза.<br>Скоро сме обратно.</h1>
                <p class="error-lead">Възникна временен проблем.</p>
                <button type="button" class="error-retry" id="error-retry">
                    Опитай отново
                    <i class="fas fa-rotate-right" aria-hidden="true"></i>
                </button>
                <div>
                    <a class="error-back" id="error-back" href="{% url 'store:index' %}">Назад</a>
                </div>
            </div>
            <img class="error-art" src="{% static 'assets/img/server-error.avif' %}" alt="" />
        </div>
    </section>
{% endblock %}

{% block extra_scripts %}
    <script>
        document.getElementById("error-retry").addEventListener("click", function () {
            window.location.reload();
        });
        var back = document.getElementById("error-back");
        if (window.history.length > 1) {
            back.addEventListener("click", function (event) {
                event.preventDefault();
                window.history.back();
            });
        } else {
            back.textContent = "Към началото";
        }
    </script>
{% endblock %}
